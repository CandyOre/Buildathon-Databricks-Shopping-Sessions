[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[dependencies]
ahash = "0.8.12"
anyhow = "1.0"
arrow-array = "54.3.1"
arrow-schema = "54.3.1"
chrono = { version = "0.4.40", default-features = false, features = ["std"] }
memchr = "2.7"
parquet = { version = "54.3.1", default-features = false, features = ["arrow", "snap"] }
rayon = "1.10"
serde_json = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
